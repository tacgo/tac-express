<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>TAC Express — Ops Console</title>
<link rel="icon" href="../../assets/favicon.svg"/>
<link rel="stylesheet" href="app.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel" src="MorePages.jsx"></script>
<script type="text/babel">
  const { Sidebar, Topbar } = window.TAC;
  const P = window.TAC.pages;
  const { useState } = React;

  const SCREENS = {
    dashboard:     { crumbs:["TAC Express","Overview"],      View: P.DashboardPage,     label:"Dashboard" },
    analytics:     { crumbs:["TAC Express","Analytics"],     View: P.AnalyticsPage,     label:"Analytics" },
    shipments:     { crumbs:["TAC Express","Shipments"],     View: P.ShipmentsPage,     label:"Shipments" },
    manifests:     { crumbs:["TAC Express","Manifests"],     View: P.ManifestsPage,     label:"Manifests" },
    scanning:      { crumbs:["TAC Express","Scanning"],      View: P.ScanningPage,      label:"Scanning" },
    inventory:     { crumbs:["TAC Express","Inventory"],     View: P.InventoryPage,     label:"Inventory" },
    exceptions:    { crumbs:["TAC Express","Exceptions"],    View: P.ExceptionsPage,    label:"Exceptions" },
    finance:       { crumbs:["TAC Express","Finance"],       View: P.FinancePage,       label:"Finance" },
    rates:         { crumbs:["TAC Express","Rate Cards"],    View: P.RateCardsPage,     label:"Rate Cards" },
    customers:     { crumbs:["TAC Express","Customers"],     View: P.CustomersPage,     label:"Customers" },
    mgmt:          { crumbs:["TAC Express","Management"],    View: P.ManagementPage,    label:"Management" },
    notifications: { crumbs:["TAC Express","Notifications"], View: P.NotificationsPage, label:"Notifications" },
    settings:      { crumbs:["TAC Express","Settings"],      View: P.SettingsPage,      label:"Settings" },
  };

  function App() {
    const [active, setActive] = useState("dashboard");
    const meta = SCREENS[active] || SCREENS.dashboard;
    const View = meta.View;
    return (
      <div className="app" data-screen-label={meta.label}>
        <Sidebar active={active} onNav={(id) => SCREENS[id] && setActive(id)}/>
        <main>
          <Topbar crumbs={meta.crumbs}/>
          <View/>
        </main>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
