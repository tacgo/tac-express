<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:18px;background:var(--paper);display:flex;gap:10px;flex-wrap:wrap}button{font:500 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:#fff;color:var(--fg-1);padding:9px 14px;border-radius:var(--r-1);cursor:pointer;display:inline-flex;align-items:center;gap:6px}.primary{background:var(--tac-violet);color:#fff;border-color:var(--tac-violet-2);box-shadow:0 1px 0 rgba(14,15,18,.06)}.primary:hover{background:var(--tac-violet-2)}.ghost{background:transparent}.ghost:hover{background:var(--paper-3)}.tab{background:transparent}.tab.active{background:var(--tac-violet);color:#fff;border-color:var(--tac-violet-2)}.danger{color:var(--err);border-color:#e8b1a4;background:var(--err-bg)}</style></head><body>
<button class="primary">+ NEW SHIPMENT</button>
<button class="ghost">+ MANIFEST</button>
<button class="tab active">ALL</button>
<button class="tab">DRAFT</button>
<button class="tab">OPEN</button>
<button class="danger">DEACTIVATE</button>
</body></html>
