<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-mono)}.tbl{border:1px solid var(--line);background:#fff;border-radius:var(--r-1);overflow:hidden}.h,.r{display:grid;grid-template-columns:140px 1fr 80px 80px;gap:8px;padding:10px 14px;align-items:center;font-size:12px}.h{background:var(--paper);border-bottom:1px solid var(--line);color:var(--fg-3);text-transform:uppercase;letter-spacing:.1em;font-weight:500}.r{border-bottom:1px solid var(--line)}.r:last-child{border-bottom:0}.r:hover{background:var(--paper-3)}.id{color:var(--tac-violet);font-weight:600}.b{padding:3px 8px;border:1px solid var(--line);border-radius:var(--r-1);font-size:10px;letter-spacing:.1em;display:inline-block}</style></head><body>
