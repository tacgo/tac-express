<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:0;background:var(--paper);font-family:var(--font-mono)}.box{margin:16px;padding:0;border:1px solid var(--line);border-radius:var(--r-1);background:#fff;position:relative}.hatch{height:8px;background-image:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}.body{padding:18px}.eye{font:500 11px var(--font-mono);letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase}.h{font:700 22px var(--font-display);letter-spacing:-0.01em;color:var(--fg-1);margin-top:4px}.s{font:400 13px var(--font-body);color:var(--fg-3);margin-top:4px}.tick{position:absolute;width:10px;height:10px}.tl{top:8px;left:8px;border-top:2px solid var(--line-3);border-left:2px solid var(--line-3)}.br{bottom:8px;right:8px;border-bottom:2px solid var(--line-3);border-right:2px solid var(--line-3)}</style></head><body>
<div class="box">
  <div class="hatch"></div>
  <span class="tick tl"></span>
  <div class="body">
    <div class="eye">Operations</div>
    <div class="h">Manifests</div>
    <div class="s">Transit manifests — create, build, depart and receive</div>
  </div>
  <div class="hatch"></div>
  <span class="tick br"></span>
</div>
</body></html>
