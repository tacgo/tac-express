<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-mono)}.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.tile{width:140px;height:80px;background-image:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);background-color:#fff;border:1px solid var(--line);border-radius:var(--r-1);position:relative}.label{font:500 10px var(--font-mono);letter-spacing:.1em;color:var(--fg-3);text-transform:uppercase;margin-top:6px}.tick{position:absolute;width:14px;height:14px}.tl{top:6px;left:6px;border-top:2px solid var(--line-3);border-left:2px solid var(--line-3)}.tr{top:6px;right:6px;border-top:2px solid var(--line-3);border-right:2px solid var(--line-3)}.bl{bottom:6px;left:6px;border-bottom:2px solid var(--line-3);border-left:2px solid var(--line-3)}.br{bottom:6px;right:6px;border-bottom:2px solid var(--line-3);border-right:2px solid var(--line-3)}.plain{background:#fff;background-image:none}</style></head><body>
<div class="row">
<div><div class="tile"></div><div class="label">Hatch top + bottom (frame)</div></div>
<div><div class="tile plain"><span class="tick tl"></span><span class="tick br"></span></div><div class="label">Corner ticks (inner card)</div></div>
<div><div class="tile plain"><span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span></div><div class="label">All four corners</div></div>
</div>
</body></html>
