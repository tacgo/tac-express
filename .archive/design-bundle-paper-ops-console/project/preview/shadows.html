<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-mono);display:flex;gap:14px;flex-wrap:wrap}.box{background:#fff;border:1px solid var(--line);border-radius:var(--r-1);padding:18px;width:180px}.l{font:500 10px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px}.s1{box-shadow:var(--sh-1)}.s2{box-shadow:var(--sh-2);border-color:transparent}.ins{box-shadow:var(--inset-line);border-color:transparent}.bot{border:1px solid var(--line);border-bottom:2px solid var(--tac-violet)}</style></head><body>
<div class="box s1"><div class="l">SH-1</div>1px ground</div>
<div class="box s2"><div class="l">SH-2</div>flat float</div>
<div class="box ins"><div class="l">INSET-LINE</div>card border</div>
<div class="box bot"><div class="l">VIOLET UNDERLINE</div>stat card</div>
</body></html>
