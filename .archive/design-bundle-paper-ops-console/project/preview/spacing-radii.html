<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:18px;background:var(--paper);display:flex;gap:14px;flex-direction:column;font-family:var(--font-mono)}.row{display:flex;gap:8px;flex-wrap:wrap}.r{padding:8px;border:1px solid var(--line);border-radius:var(--r-sharp);background:#fff;font:500 10px var(--font-mono);color:var(--fg-3);min-width:80px;text-align:center}</style></head><body>
<div>
  <div style="font:500 10px var(--font-mono);letter-spacing:.1em;color:var(--fg-3);margin-bottom:8px;text-transform:uppercase">Radii</div>
  <div class="row">
    <div class="r" style="border-radius:0">SHARP · 0</div>
    <div class="r" style="border-radius:2px">SHARP · 2</div>
    <div class="r" style="border-radius:4px">R-1 · 4</div>
    <div class="r" style="border-radius:6px">R-2 · 6</div>
    <div class="r" style="border-radius:999px">PILL</div>
  </div>
</div>
<div>
  <div style="font:500 10px var(--font-mono);letter-spacing:.1em;color:var(--fg-3);margin-bottom:8px;text-transform:uppercase">Spacing scale (px)</div>
  <div class="row">
    <div class="r" style="width:4px;padding:0;height:24px"></div>
    <div class="r" style="width:8px;padding:0;height:24px"></div>
    <div class="r" style="width:12px;padding:0;height:24px"></div>
    <div class="r" style="width:16px;padding:0;height:24px"></div>
    <div class="r" style="width:24px;padding:0;height:24px"></div>
    <div class="r" style="width:32px;padding:0;height:24px"></div>
    <div class="r" style="width:48px;padding:0;height:24px"></div>
    <div class="r" style="width:64px;padding:0;height:24px"></div>
  </div>
</div>
</body></html>
