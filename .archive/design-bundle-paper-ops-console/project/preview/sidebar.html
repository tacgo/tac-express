<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:18px;background:var(--paper-2);font-family:var(--font-mono)}.nav{width:240px;background:var(--paper-2);border-right:1px solid var(--line);padding:14px 0}.sec{font:500 10px var(--font-mono);letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase;padding:8px 18px;display:flex;justify-content:space-between}.item{display:flex;align-items:center;gap:10px;padding:9px 18px;font:600 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);cursor:pointer}.item:hover{background:var(--paper-3);color:var(--fg-1)}.item.active{background:var(--tac-violet-50);color:var(--tac-violet);position:relative}.item.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tac-violet)}.dot{width:6px;height:6px;background:currentColor;display:inline-block;margin-left:auto}</style></head><body>

  <div class="item active">▦ Dashboard <span class="dot"></span></div>
  <div class="item">▥ Analytics</div>
  <div class="sec" style="margin-top:8px">// Operations</div>
  <div class="item">▢ Shipments</div>
  <div class="item">▤ Manifests</div>
</div>
</body></html>
