<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap}.b{padding:6px 10px;border:1px solid;border-radius:var(--r-1);font:500 11px var(--font-mono);letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px}.dot{width:6px;height:6px;background:currentColor}</style></head><body><div class="row">
<span class="b" style="color:var(--ok);background:var(--ok-bg);border-color:#bcdcca"><span class="dot"></span>DELIVERED</span>
<span class="b" style="color:var(--warn);background:var(--warn-bg);border-color:#e8c98e"><span class="dot"></span>DRAFT</span>
<span class="b" style="color:var(--err);background:var(--err-bg);border-color:#e8b1a4"><span class="dot"></span>EXCEPTION</span>
<span class="b" style="color:var(--info);background:var(--info-bg);border-color:#aac3eb"><span class="dot"></span>IN TRANSIT</span>
<span class="b" style="color:var(--tac-violet);background:var(--tac-violet-50);border-color:#cebcff"><span class="dot"></span>ISSUED</span>
<span class="b" style="color:var(--fg-1);background:#fff;border-color:var(--line)"><span class="dot" style="background:var(--fg-3)"></span>CREATED</span>
</div></body></html>
