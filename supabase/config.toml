# Supabase configuration for TAC Express.
# Reference: https://supabase.com/docs/guides/cli/config
project_id = "tac-express"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.invoices]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.manifests]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.proof-of-delivery]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]

[storage.buckets.exception-photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.recovery]
subject = "Reset your TAC Express password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your TAC Express sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

[functions.send-notification]
verify_jwt = true

[functions.generate-pdf]
verify_jwt = true

[functions.dispatch-webhook]
verify_jwt = true

[functions.scheduled-sla-monitor]
verify_jwt = false
