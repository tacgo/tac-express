<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in to TAC Express</title>
  </head>
  <body
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; max-width: 560px; margin: 32px auto; color: #111;"
  >
    <h2 style="margin: 0 0 16px;">Sign in to TAC Express</h2>
    <p>Click the link below to sign in. The link is single-use and expires in 1 hour.</p>
    <p style="margin: 24px 0;">
      <a
        href="{{ .ConfirmationURL }}"
        style="display: inline-block; background: #6633e6; color: #fff; padding: 12px 20px; text-decoration: none; font-weight: 600;"
        >Sign in</a
      >
    </p>
    <p style="color: #555; font-size: 13px;">
      Or copy this one-time code:
      <strong style="font-family: 'IBM Plex Mono', monospace;">{{ .Token }}</strong>
    </p>
    <p style="color: #888; font-size: 12px; margin-top: 32px;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </body>
</html>
