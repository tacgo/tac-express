# CodeRabbit configuration — tac-express
# https://docs.coderabbit.ai/guides/configure-coderabbit
#
# IMPORTANT: This PR is large because it's the first real push of the project
# to GitHub (main was just a 130-byte bootstrap README). The path filters
# below scope CodeRabbit's review to the actual application code and skip
# vendored tooling, generated assets, and pure documentation. This brings
# the file count under the per-review limit.
#
# Categories scoped OUT of review:
#   .archive/**              — retired legacy systems (GSD, .agents stubs, etc.)
#   .claude/**               — agent skill files (markdown, not code)
#   .windsurf/**             — IDE-specific (we removed but ignore in case)
#   .planning/**             — planning docs (mostly removed)
#   docs/**                  — pure documentation
#   supabase/migrations/**   — DDL (better reviewed by SQL expert / DB tooling)
#   supabase/seed.sql        — seed data
#   supabase/config.toml     — Supabase project config
#   scripts/**               — governance audit tooling (high-care, human-only)
#   *.md (root)              — governance docs (AGENTS, CLAUDE, DESIGN_SYSTEM)
#   pnpm-lock.yaml etc.      — lockfiles
#   packages/database/src/database.types.ts — generated by Supabase CLI
#   packages/eslint-config/** — meta tooling
#   packages/typescript-config/** — meta tooling
#   public/**                — static assets

language: en-US
tone_instructions: >-
  Be precise and technical. Reference the Fourteen Laws (AGENTS.md § 4)
  and the Violet Grid v6 spec (docs/VIOLET-GRID-V6-EVOLUTION.md) when
  relevant. Skip stylistic nits in markdown.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      # Review-style PRs are opened against pinned baseline refs so the diff
      # captures a full session's worth of work without conflicting with main
      # (which already contains those commits). Without this entry, CodeRabbit
      # silently skips the PR and the team falls back to manual @coderabbitai.
      - "baseline/.*"

  # AGGRESSIVE path filters — keep review scoped to actual application code.
  # Lines starting with `!` exclude paths from review.
  path_filters:
    # ── Vendored / framework tooling (not our code) ────────────────────────
    - "!.archive/**"
    - "!.claude/**"
    - "!.windsurf/**"
    - "!.planning/**"
    # ── Pure documentation (large but not code) ────────────────────────────
    - "!docs/**"
    - "!*.md"
    - "!**/CHANGELOG.md"
    - "!README.md"
    - "!AGENTS.md"
    - "!CLAUDE.md"
    - "!DESIGN_SYSTEM.md"
    # ── Supabase artifacts (DDL / seed / config) ───────────────────────────
    - "!supabase/migrations/**"
    - "!supabase/seed.sql"
    - "!supabase/config.toml"
    - "!supabase/.gitignore"
    # ── Governance / CI tooling (review by hand, not LLM) ──────────────────
    - "!scripts/**"
    # ── Generated content ──────────────────────────────────────────────────
    - "!packages/database/src/database.types.ts"
    - "!packages/database/src/supabase.types.ts"
    # ── Meta config packages ───────────────────────────────────────────────
    - "!packages/eslint-config/**"
    - "!packages/typescript-config/**"
    # ── Lockfiles + build outputs ──────────────────────────────────────────
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/.turbo/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/node_modules/**"
    # ── Static / public assets ─────────────────────────────────────────────
    - "!public/**"
    - "!**/public/**"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"
    - "!**/*.ico"
    - "!**/*.lottie"
    - "!**/*.json"
    # ── Tests are reviewed (intentional inclusion) ─────────────────────────
    # packages/services/src/__tests__/** stays reviewed

  path_instructions:
    - path: "packages/ui/src/styles/globals.css"
      instructions: >-
        Source of truth for ALL design tokens (LAW 1). Verify any new
        tokens follow the v6 namespaces (--surface-*, --overlay-*,
        --motion-*, --spacing-*) and that .dark mirrors :root for the
        same token names.

    - path: "packages/ui/src/components/**/*.tsx"
      instructions: >-
        UI components must (a) live in packages/ui (LAW 5), (b) use
        semantic tokens not Tailwind color classes (LAW 10), (c) avoid
        arbitrary Tailwind values like w-[347px] (LAW 11), (d) use CVA
        variants and data-slot attributes, (e) use @workspace/ui/icons
        for Remix Icon imports (LAW 2). Flag any violations specifically.

    - path: "packages/services/src/**/*.ts"
      instructions: >-
        Business logic only. No React components. Inputs should use
        TablesInsert<> from @workspace/database/database.types where
        possible. No @supabase/supabase-js imports outside packages/database
        (LAW 8).

    - path: "apps/**/*.{ts,tsx}"
      instructions: >-
        App layer must NOT contain UI components (LAW 5) — those go in
        packages/ui. App layer must NOT contain business logic (LAW 7) —
        that goes in packages/services. App layer routes Supabase access
        via @workspace/database (LAW 8).

    - path: "supabase/functions/**/*.ts"
      instructions: >-
        Deno edge functions. Imports from "jsr:@supabase/supabase-js@2"
        or "https://esm.sh/" are EXPECTED — these are the only files
        exempt from LAW 8.

  tools:
    eslint:
      enabled: true
    biome:
      enabled: false
    shellcheck:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
